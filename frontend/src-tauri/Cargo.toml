[package]
name = "pdf-viewer"
version = "0.1.0"
description = "PDF Viewer: a Windows desktop PDF viewer and markup tool"
authors = ["PDF Viewer contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-window-state = "2.2.1"
tokio = { version = "1.50", features = ["sync"] }
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
