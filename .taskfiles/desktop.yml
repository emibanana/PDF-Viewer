version: '3'

# Tauri's beforeDevCommand / beforeBuildCommand run `vite --mode studio`, so
# the desktop entrypoints need no separate frontend step.
env:
  UV_THREADPOOL_SIZE: "16"

tasks:
  dev:
    desc: "Start the desktop app in dev mode"
    cmds:
      - npx tauri dev

  build:
    desc: "Build the desktop app (production)"
    cmds:
      - npx tauri build

  build:dev:
    desc: "Build the desktop app without bundling"
    cmds:
      - npx tauri build --no-bundle

  build:dev:windows:
    desc: "Build the Windows NSIS installer"
    cmds:
      - npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

  test:
    desc: "Run Rust tests"
    dir: src-tauri
    cmds:
      - cargo test

  lint:
    desc: "Run Rust linting"
    cmds:
      - task: lint:app
      - task: lint:thumbnail-handler

  lint:app:
    desc: "Lint the Tauri app crate"
    dir: src-tauri
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  lint:thumbnail-handler:
    desc: "Lint the Windows thumbnail handler crate"
    platforms: [windows]
    dir: src-tauri/thumbnail-handler
    cmds:
      - cargo clippy --all-targets -- -D warnings

  format:
    desc: "Auto-fix Rust formatting"
    dir: src-tauri
    cmds:
      - cargo fmt
      - cargo fmt --manifest-path thumbnail-handler/Cargo.toml

  format:check:
    desc: "Check Rust formatting"
    dir: src-tauri
    cmds:
      - cargo fmt -- --check
      - cargo fmt --manifest-path thumbnail-handler/Cargo.toml -- --check

  check:
    desc: "Desktop quality gate"
    cmds:
      - task: lint
      - task: format:check
      - task: test

  clean:
    desc: "Clean Cargo build artifacts"
    cmds:
      - cd src-tauri && cargo clean
