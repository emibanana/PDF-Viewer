version: '3'

# The precompression pass queues more zlib jobs than the default four-thread
# pool can keep busy. It has to be set before Node starts: loading the Vite
# config already touches the pool, so an assignment inside the config is too
# late.
env:
  UV_THREADPOOL_SIZE: "16"

# Tasks operate from the workspace root (frontend/). Editor commands pass
# `editor` as the vite project root (positional after `build` / before the
# mode flag) or use `--project editor/...` for tsc — so the editor lives
# under frontend/ without each task needing a cd.

vars:
  # Dev-only browser-tab label so concurrent worktrees are distinguishable. Only
  # the worktree folder basename (e.g. "wt1") is exposed — never the full path,
  # hostname, or user. Dropped from production builds.
  DEV_LABEL:
    sh: >-
      {{if eq OS "windows"}}powershell -NoProfile -Command '$root = git rev-parse --show-toplevel 2>$null; if (-not $root) { $root = (Get-Location).Path }; Split-Path -Leaf $root'{{else}}basename "$(git rev-parse --show-toplevel 2>/dev/null || pwd)"{{end}}
  VITEST_JOBS: '{{if .STIRLING_CHECK_JOBS}} --maxWorkers={{.STIRLING_CHECK_JOBS}}{{end}}'
  OX_THREADS: '{{if .STIRLING_CHECK_JOBS}} --threads={{.STIRLING_CHECK_JOBS}}{{end}}'

tasks:
  install:
    desc: "Install dependencies"
    run: once
    cmds:
      - '{{ if eq .CI "true" }}npm ci{{ else }}npm install{{ end }}'
    sources:
      - package-lock.json
      - package.json
    status:
      - npm ls --depth=0
    env:
      CI: '{{ .CI | default "false" }}'

  prepare:env:
    internal: true
    run: when_changed
    deps: [install]
    vars:
      MODE: '{{.MODE | default ""}}'
    cmds:
      - npx tsx scripts/setup-env.mts{{if .MODE}} --{{.MODE}}{{end}}
    sources:
      - scripts/setup-env.mts
    generates:
      - .env.local
      - .env{{if .MODE}}.{{.MODE}}{{end}}.local

  prepare:og:
    internal: true
    run: when_changed
    desc: "Regenerate OG/social-preview metadata from the tool registry"
    cmds:
      - node scripts/generate-og-metadata.mjs
    sources:
      - src/editor/core/types/toolId.ts
      - src/editor/core/utils/urlMapping.ts
      - src/editor/core/data/useTranslatedToolRegistry.tsx
      - public/og_images/*.png
    generates:
      - src/editor/core/data/ogImageMap.json
      - public/og-metadata.json

  prepare:
    desc: "Set up dev environment"
    run: when_changed
    vars:
      MODE: '{{.MODE | default ""}}'
    deps:
      - task: prepare:env
        vars: { MODE: '{{.MODE}}' }
      - prepare:og

  # ============================================================
  # Development
  # ============================================================

  dev:
    desc: "Start the frontend dev server (studio mode)"
    ignore_error: true
    env:
      STIRLING_DEV_LABEL: '{{.DEV_LABEL}}'
    cmds:
      - npx vite --mode studio --port {{.PORT | default "5173"}}{{if .OPEN}} --open{{end}}

  # ============================================================
  # Code quality
  # ============================================================

  lint:
    desc: "Run linting"
    deps: [install]
    cmds:
      - task: lint:oxlint
      - task: lint:colors
      - task: lint:icons
      - task: lint:css

  lint:icons:
    desc: "Enforce one icon system - no inline svg, no retired icon libraries"
    deps: [install]
    cmds:
      - npx tsx scripts/lint/icon-lint.mts

  lint:unused-icons:
    desc: "Report icons we draw ourselves that nothing renders"
    deps: [install]
    cmds:
      - npx tsx scripts/lint/icon-lint.mts unused

  lint:css:
    desc: "Lint stylesheets for duplicate selectors"
    deps: [install]
    cmds:
      # Covers the whole editor tree, including the portal/processor layer and
      # public/css. Vendored CSS and build output are excluded via ignoreFiles
      # in stylelint.config.mjs.
      - npx stylelint "{src,public}/**/*.css"

  lint:colors:
    desc: "Enforce theme tokens — no hardcoded colours or raw primitives in components"
    aliases: [lint:colours]
    deps: [install]
    cmds:
      - node scripts/lint/theme-lint.mjs
      - node scripts/lint/theme-lint.mjs css-colors
      - node scripts/lint/theme-lint.mjs code-colors
      - node scripts/lint/theme-lint.mjs no-primitives

  contrast:
    desc: "Report low-contrast theme token pairs (warning only, never blocks)"
    deps: [install]
    cmds:
      - node scripts/lint/theme-lint.mjs contrast

  lint:oxlint:
    desc: "Run oxlint linting"
    deps: [install]
    cmds:
      - npx oxlint --config oxlint.config.ts --max-warnings=0{{.OX_THREADS}}

  lint:fix:
    desc: "Auto-fix lint issues"
    deps: [install]
    cmds:
      - npx oxlint --config oxlint.config.ts --fix

  format:
    desc: "Auto-fix code formatting"
    deps: [install]
    cmds:
      - npx oxfmt --write .

  format:check:
    desc: "Check code formatting"
    deps: [install]
    cmds:
      - npx oxfmt --check .{{.OX_THREADS}}

  fix:
    desc: "Auto-fix lint and format"
    cmds:
      - task: format
      - task: lint:fix

  typecheck:
    desc: "Typecheck the app"
    cmds:
      - task: typecheck:studio

  typecheck:studio:
    desc: "Typecheck the app's own layer and the core it builds on"
    deps: [prepare]
    cmds:
      - task: typecheck:_run
        vars: { PROJECT: tsconfig.studio.vite.json }

  typecheck:_run:
    internal: true
    cmds:
      - 'npx tsc --noEmit --project {{.PROJECT}}'

  typecheck:scripts:
    desc: "Typecheck scripts"
    deps: [prepare]
    cmds:
      - task: typecheck:_run
        vars: { PROJECT: scripts/tsconfig.json }

  typecheck:storybook:
    desc: "Typecheck Storybook config and stories"
    deps: [prepare]
    cmds:
      - task: typecheck:_run
        vars: { PROJECT: .storybook/tsconfig.json }

  typecheck:all:
    desc: "Typecheck everything the app builds from"
    cmds:
      - task: typecheck:studio

  # ============================================================
  # Quality Gate
  # ============================================================

  check:
    desc: "Quick quality gate for local development"
    cmds:
      - task: typecheck
      - task: lint
      - task: format:check
      - task: test

  og:check:
    desc: "Fail if committed OG/social-preview metadata is out of date"
    cmds:
      - node scripts/generate-og-metadata.mjs --check

  check:all:
    desc: "Full CI quality gate"
    cmds:
      # Runs first, before prepare regenerates: guards the committed og-metadata.json /
      # ogImageMap.json that the Cloudflare Pages (plain `vite build`) deploy relies on.
      - task: og:check
      - task: typecheck:all
      - task: lint
      - task: format:check
      - task: build
      - task: test
      - task: storybook:build

  # ============================================================
  # Test
  # ============================================================

  test:
    desc: "Run tests"
    cmds:
      - task: test:editor

  test:editor:
    desc: "Run editor tests"
    deps: [prepare]
    vars:
      COVERAGE: '{{.COVERAGE | default .CI | default "false"}}'
    cmds:
      - >
        npx vitest run --root . --project core --project studio{{.VITEST_JOBS}}
        {{if eq .COVERAGE "true"}}--coverage
        --coverage.provider=v8
        --coverage.reporter=text-summary
        --coverage.reporter=json-summary
        --coverage.reporter=html
        --coverage.reportsDirectory=./coverage{{end}}

  test:watch:
    desc: "Run tests in watch mode"
    deps: [prepare]
    cmds:
      - npx vitest --watch --root .

  test:coverage:
    desc: "Run tests with coverage (one-shot; CI-friendly)."
    cmds:
      - task: test:editor
        vars: { COVERAGE: "true" }

  # ============================================================
  # Code Generation
  # ============================================================

  licenses:generate:
    desc: "Generate frontend license report"
    deps: [install]
    cmds:
      - node scripts/generate-licenses.js

  # ============================================================
  # Clean
  # ============================================================

  clean:
    desc: "Clean build artifacts and caches"
    cmds:
      - cmd: powershell rm -Recurse -Force -ErrorAction SilentlyContinue node_modules/.vite, dist
        platforms: [windows]
      - cmd: rm -rf node_modules/.vite dist
        platforms: [linux, darwin]
